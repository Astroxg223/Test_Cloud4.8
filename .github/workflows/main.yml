name: Android Emulator CI

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level'
        required: false
        default: '35'
        type: string
      keep_alive_minutes:
        description: 'Keep the emulator alive after tests, max 330 minutes'
        required: false
        default: '0'
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dkotlin.incremental=true
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 30

jobs:
  emulator:
    name: Android emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      API_LEVEL: ${{ inputs.api_level || '35' }}
      KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android Gradle project
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo '::error::No ./gradlew found. This workflow must run at the repository root of an Android Gradle project.'
            echo 'Expected: gradlew, gradle/wrapper/gradle-wrapper.properties, and at least one build.gradle(.kts).'
            exit 1
          fi
          chmod +x ./gradlew
          if ! find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit | grep -q .; then
            echo '::error::No build.gradle or build.gradle.kts found.'
            exit 1
          fi

      - name: Set up Gradle without fragile setup-java cache lookup
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          if [ ! -e /dev/kvm ]; then
            echo '::error::KVM is unavailable on this runner; refusing slow software emulation.'
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Validate runtime limit
        shell: bash
        run: |
          case "$KEEP_ALIVE_MINUTES" in ''|*[!0-9]*) echo '::error::keep_alive_minutes must be an integer.'; exit 1;; esac
          if [ "$KEEP_ALIVE_MINUTES" -gt 330 ]; then
            echo '::error::keep_alive_minutes cannot exceed 330 minutes.'
            exit 1
          fi

      - name: Run instrumented tests on hardware-accelerated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 6144M
          heap-size: 512M
          disk-size: 8192M
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell input keyevent 82 || true
            ./gradlew --no-daemon --stacktrace connectedCheck
            if [ "$KEEP_ALIVE_MINUTES" -gt 0 ]; then
              echo "Keeping emulator alive for ${KEEP_ALIVE_MINUTES} minutes."
              timeout --signal=TERM "${KEEP_ALIVE_MINUTES}m" bash -c 'while true; do adb shell echo emulator-alive >/dev/null; sleep 30; done'
            fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
